<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายละเอียดใบเบิกค่าใช้จ่าย</title>
<style>
body{margin:0;background:#f5f7f9;font-family:Arial,"Noto Sans Thai",sans-serif;color:#222}.wrap{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 18px rgba(0,0,0,.08)}h2{margin:0 0 16px}.muted{color:#6b7280;font-size:13px}.row{margin-top:10px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}.amount{font-weight:800;margin-top:5px}.total{font-size:24px;font-weight:800;margin-top:16px}.receipt{display:inline-block;margin-top:8px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;margin-top:8px}.error{color:#b91c1c;background:#fee2e2;padding:12px;border-radius:10px}.loading{text-align:center;padding:30px;color:#666}
</style>
</head><body><div class="wrap"><div class="card"><h2>💰 รายละเอียดใบเบิกค่าใช้จ่าย</h2><div id="app" class="loading">กำลังโหลดรายละเอียด...</div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyfRUyjfW6hLsBB2j8VQzgp1pHZGGzpPlR0h8fzuBNRQ4cFddG-eU8hErbnzOj4peJF/exec';
const token=new URLSearchParams(location.search).get('token')||'';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(v){return Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2});}
function load(){
 if(!token){document.getElementById('app').innerHTML='<div class="error">ไม่พบ Approval Token</div>';return;}
 const cb='expenseDetailCb_'+Date.now();
 window[cb]=function(r){try{delete window[cb]}catch(e){};render(r)};
 const s=document.createElement('script');s.src=API_URL+'?action=expenseDetailApi&token='+encodeURIComponent(token)+'&callback='+cb;s.onerror=()=>{document.getElementById('app').innerHTML='<div class="error">ไม่สามารถโหลดรายละเอียดได้</div>';try{delete window[cb]}catch(e){}};document.body.appendChild(s);
}
function render(r){
 if(!r||!r.success){document.getElementById('app').innerHTML='<div class="error">'+esc(r&&r.message||'ไม่สามารถโหลดรายละเอียดได้')+'</div>';return;}
 const x=r.data||{};const items=Array.isArray(x.items)?x.items:[];
 document.getElementById('app').innerHTML=`<div class="muted">เลขที่ใบเบิก</div><div><b>${esc(x.expenseId)}</b></div><div class="row"><b>ผู้เบิก:</b> ${esc(x.employeeName)}</div><div><b>แผนก:</b> ${esc(x.department)}</div><div><b>วันที่:</b> ${esc(x.date)}</div><div class="row"><b>วัตถุประสงค์</b><div>${esc(x.purpose||'-')}</div></div><div class="badge">ขั้นตอนปัจจุบัน: ${esc(x.currentLevelText||'-')}</div><h3 style="margin:18px 0 6px">รายการค่าใช้จ่าย</h3>${items.map(it=>`<div class="item"><b>รายการที่ ${esc(it.itemNo)}</b><div class="muted">${esc(it.date)} · ${esc(it.type)}</div><div>${esc(it.purpose||'-')}</div><div class="amount">${money(it.amount)} บาท</div>${it.receiptUrl?`<a class="receipt" href="${esc(it.receiptUrl)}" target="_blank" rel="noopener">📎 ดูใบเสร็จ</a>`:''}</div>`).join('')}<div class="total">รวม ${money(x.total)} บาท</div>`;
}
load();
</script></body></html>
